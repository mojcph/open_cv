# Runtime configuration for the stereo rig.
camera:
  width: 1280
  height: 960
  rotation: ccw90        # none | cw90 | ccw90 | 180 — applied before anything else
  left_index: 0          # Picamera2 camera number for the left image
  right_index: 1
  swap_left_right: true  # true = swap the two cameras (camera 0 is physically on the right)

  # Fixed capture settings. Calibration (phase 3) is only valid for these exact values.
  sensor_size: [2304, 1296]  # imx708 full-field 2x2 binned mode (1536x864 is a centre crop)
  frame_rate: 30
  lens_position: 1.0     # manual focus in dioptres = 1 / distance in m (0 = infinity, 1 = 1 m)
                         # null = continuous autofocus (breaks calibration!)

  # Frame synchronisation
  sync: true             # libcamera software sync: left camera = server, right = client
  max_pair_dt_ms: 5      # drop left/right pairs further apart than this.
                         # With sync: ~0.02 ms typical. Without sync use ~20 (half a frame).

web:
  host: 127.0.0.1
  port: 5000
  jpeg_quality: 80
  preview_scale: 0.5     # browser stream size; capture/processing always use full resolution

# ChArUco calibration board (phase 3). Generate it with: python scripts/make_board.py
# After printing, MEASURE a square and enter the real sizes here - calibration accuracy
# depends on it. marker_mm scales with square_mm (keep the 22/30 ratio).
board:
  squares_x: 9
  squares_y: 6
  # TEMPORARY: board shown on PC screen, square measured 24 mm (80% scale).
  # Printed board: set back to 30.0 / 22.0, or the measured printed sizes.
  square_mm: 24.0
  marker_mm: 17.6
  dictionary: DICT_5X5_100
