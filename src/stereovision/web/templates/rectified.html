<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rectified View</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="page">
      <h1>Rectified view</h1>
      <img class="video-feed" src="{{ url_for('rectified_video') }}"
           alt="Rectified left and right images with horizontal guide lines">
      <p>With a good calibration, every feature sits on the <strong>same green line</strong> in
        both images, and straight edges look straight. If features drift above or below
        each other, or the image looks warped, recalibrate.</p>
      <p><a href="{{ url_for('index') }}">Back to live view</a></p>
    </main>
  </body>
